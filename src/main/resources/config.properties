# =========================================================
# ALL-CUSTOMER PROFILE BACKFILL (MERGED FROM RESUME SYSTEM)
# Opens Mariners Mentor Customers -> ACTIVE -> Period=All Time in headless Chrome.
# Page Size = 100 and follows Next Page until the final page.
# Uses each customer's INDoS credentials to read the DG profile and fills ONLY blank DG-backed fields.
# Existing MM values are never overwritten.
# Once a customer is successfully updated/already complete, its ID is saved
# under %LOCALAPPDATA%\MarinersMentor\MMcasesBot\customer-profile-sync.properties.
# Customers with missing/wrong INDoS details stay in the retry pool until corrected.
# DG profile sync is kept enabled for the Membership Lifetime case trigger.
# Startup/daily all-customer DG backfill is disabled; ordinary cases keep their usual mail/WhatsApp flow.
# =========================================================
