customer.profile.sync.headless=true
customer.profile.sync.keep.browser.open=false
customer.profile.sync.wait.seconds=25
customer.profile.sync.dg.wait.seconds=90
customer.profile.sync.keep.dg.pdf=false

# =========================================================
# PUBLIC DG SHIPPING SID CHECKER - MANUAL CAPTCHA
# If MM + normal DG profile do not provide complete SID details, the bot
# opens the official SID Checker in a VISIBLE browser, fills INDoS, and waits
# for you to type the CAPTCHA and click Search/Submit. It then reads SID No,
# Issue Date and Expiry Date and continues automatically.
# =========================================================
